name: Server Release CI
on:
  release:
    types: [released]
  push:
    branches:
      - main
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set env
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          elif [[ $GITHUB_EVENT_NAME == "release" ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=latest" >> $GITHUB_ENV
          fi
      - name: Use Go
        uses: actions/setup-go@v2
        id: setup_go
        with:
          go-version: "1.22.6"
      - name: Cache go-modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Gopie Server to Docker Hub
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: factly/gopie-server:${{ env.RELEASE_VERSION }}
          file: server/Dockerfile
          context: server
          
      - name: Build and push Gopie migration to Docker Hub
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: factly/gopie-migrate:${{ env.RELEASE_VERSION }}
          file: server/Dockerfile.migrate
          context: server

