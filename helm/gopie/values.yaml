# Default values for gopie.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


dbtype: motherduck

imagePullSecrets: []  # List of image pull secrets for private registries
nameOverride: ""  # Override the name of the chart
fullnameOverride: "gopie"  # Override the full name of the chart resources

deployment:
  name: server  # Name of the server deployment
  image:
    repository: "factly/gopie-server"  # Docker image repository for the main application (e.g., your-registry/gopie)
    pullPolicy: Always  # Image pull policy: Always, IfNotPresent, or Never
    tag: "latest"  # Image tag to use; defaults to chart appVersion if empty

  replicaCount: 1  # Number of server replicas to run
  extraLabels: {}  # Extra labels to add to deployment resources
  extraPodLabels: {}  # Extra labels to add to pods
  annotations: {}  # Annotations for deployment resources
  Podannotations: {}  # Annotations for pods

  env:
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gopie-postgresql
          key: postgres-password
    - name: POSTGRES_DB
      value: "gopie"
    - name: POSTGRES_HOST
      value: "gopie-postgresql"
    - name: POSTGRES_PORT
      value: "5432"
    - name: GOPIE_LOGGER_LEVEL
      value: "info"
    - name: GOPIE_LOGGER_FILE
      value: "gopie.log"
    - name: GOPIE_LOGGER_MODE
      value: "dev"
    - name: GOPIE_OPENAI_APIKEY
      value: "bRUBnBaNaOg8Qou7B7jVHsuIVsc="
    - name: GOPIE_OPENAI_BASEURL
      value: "https://api.portkey.ai/v1"
    - name: GOPIE_OPENAI_MODEL
      value: "o3-mini"
    - name: GOPIE_OPENAI_OPTIONS
      value: "x-portkey-virtual-key=openai-test-11e8b7,x-portkey-api-key=bRUBnBaNaOg8Qou7B7jVHsuIVsc="
    - name: GOPIE_DUCKDB_PATH
      value: "./dataful/gopie.duckdb"
    - name: GOPIE_OLAPDB_ACCESS_MODE
      value: "read_write"
    - name: GOPIE_OLAPDB_DBTYPE
      value: "motherduck"
    - name: GOPIE_MOTHERDUCK_TOKEN
      value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..3cAa_0z5CrGQgU6r4SYlj_oc6yrQOH2UkpdU8fSLgT4"
    - name: GOPIE_MOTHERDUCK_DB_NAME
      value: "test"
    - name: GOPIE_MOTHERDUCK_HELPER_DB_DIR_PATH
      value: "./motherduck"
    - name: GOPIE_CORS_HANDLED_BY_INGRESS
      value: "false"
    - name: GOPIE_POSTGRES_HOST
      value: "gopie-postgresql"
    - name: GOPIE_POSTGRES_PORT
      value: "5432"
    - name: GOPIE_POSTGRES_DB
      value: "gopie"
    - name: GOPIE_POSTGRES_USER
      value: "postgres"
    - name: GOPIE_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: gopie-postgresql
          key: postgres-password
    - name: GOPIE_POSTGRES_SSLMODE
      value: "disable"
    - name: GOPIE_AIAGENT_URL
      value: "http://chat-server:8003"
    - name: GOPIE_ENCRYPTION_KEY
      value: "E5B8A0F3C1D9E7B2A5F0C3D8E6B1A4F2"
    - name: GOPIE_ENABLED_SERVERS
      value: "api"
    - name: GOPIE_S3_ACCESS_KEY
      value: "IHJWCLQNI113NEQODJXT"
    - name: GOPIE_S3_SECRET_KEY
      value: "HeH6eHrfdmS0i55C6UZz0KgJDvp9ODjEfMB4YVVh"
    - name: GOPIE_S3_ENDPOINT
      value: "https://s3.eu-central-1.wasabisys.com"
    - name: GOPIE_S3_SSL
      value: "true"
    - name: GOPIE_S3_REGION
      value: "eu-central-1"
    - name: GOPIE_DOWNLOADS_S3_BUCKET
      value: "downloads"

  initContainers:  # List of init containers to run before the app container
  - name: gopie-migrate  # Example init container for DB migration
    image: "factly/gopie-migrate:latest"  # Image for the init container (e.g., your-registry/gopie-migrate:tag)
    command:
      - sh
      - -c
      - |
        export PGPASSWORD="${POSTGRES_PASSWORD}"
        goose postgres "host=gopie-postgresql port=5432 user=postgres dbname=gopie sslmode=disable" up
    env:
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: gopie-postgresql
            key: postgres-password
      - name: GOOSE_MIGRATION_DIR
        value: /app/migrations

  podSecurityContext: {}  # Pod-level security context (e.g., fsGroup)
    # Example:
    # fsGroup: 2000

  securityContext: {}  # Container-level security context (e.g., runAsUser)
    # Example:
    # runAsUser: 1000


  resources: {}  # Pod resource requests and limits
    # limits:
    #   cpu: 200m
    #   memory: 1Gi
    # requests:
    #   cpu: 100m
    #   memory: 100Mi

  autoscaling:
    enabled: false  # Enable Horizontal Pod Autoscaler
    minReplicas: 5  # Minimum number of replicas if autoscaling is enabled
    maxReplicas: 20  # Maximum number of replicas
    targetCPUUtilizationPercentage: 80  # Target average CPU usage
    targetMemoryUtilizationPercentage: 80  # Target average Memory usage

  podDisruptionBudget:
    enabled: false  # Enable Pod Disruption Budget for high availability
    maxUnavailable: 1  # Maximum number of pods that can be unavailable during voluntary disruptions

  # Uncomment and configure liveness/readiness probes if needed
  livenessProbe:
    httpGet:
      path: /health/live  # Health endpoint to check application liveness
      port: http  # Port to use for health checks
    initialDelaySeconds: 60  # Wait 60s after container starts before first check (allows app startup)
    periodSeconds: 10  # Check health every 10 seconds
    timeoutSeconds: 5  # Wait up to 5 seconds for health check response
    successThreshold: 1  # Need 1 successful check to be considered healthy
    failureThreshold: 3  # Restart container after 3 consecutive failures
  readinessProbe:
    httpGet:
      path: /health/ready  # Health endpoint to check application readiness
      port: http  # Port to use for readiness checks
    initialDelaySeconds: 10  # Wait 10s after container starts before first check
    periodSeconds: 5  # Check readiness every 5 seconds
    timeoutSeconds: 3  # Wait up to 3 seconds for readiness check response
    successThreshold: 1  # Need 1 successful check to be considered ready
    failureThreshold: 3  # Stop traffic to pod after 3 consecutive failures

  nodeSelector: {}  # Node selector for scheduling the pods

  tolerations: []  # Tolerations for scheduling onto nodes with taints

  affinity: {}  # Pod affinity/anti-affinity rules

  extraVolumeMounts: []  # Additional volume mounts for the container
    # Example:
    # - name: config-volume
    #   mountPath: /etc/config
    #   readOnly: true
    # - name: data-volume
    #   mountPath: /data
    #   subPath: myapp-data

  extraVolumes: []  # Additional volumes for the pod
    # Supports: persistentVolumeClaim, hostPath, configMap, secret, emptyDir, csi
    # Examples:
    # - name: config-volume
    #   configMap:
    #     name: app-config
    # - name: secret-volume
    #   secret:
    #     secretName: app-secrets
    # - name: data-volume
    #   existingClaim: my-pvc
    # - name: host-volume
    #   hostPath:
    #     path: /mnt/data
    #     type: Directory
    # - name: cache-volume
    #   emptyDir:
    #     sizeLimit: 1Gi


